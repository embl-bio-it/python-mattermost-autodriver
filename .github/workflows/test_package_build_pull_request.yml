name: Test building python package

on: [pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine -r requirements-dev.txt
    - name: Build a source tarball and a binary wheel from it
      run: |
        python -m build
    - name: Check distribution metadata
      run: |
        twine check --strict dist/*
    - name: Install the built wheel
      run: |
        pip install dist/*.whl
    - name: Run the test suite against the installed wheel
      # Run from outside the checkout so the source tree cannot shadow the
      # installed package and packaging mistakes (e.g. a module missing from
      # the wheel) are caught
      working-directory: ${{ runner.temp }}
      run: pytest "$GITHUB_WORKSPACE/tests"
